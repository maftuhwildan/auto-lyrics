name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A normal tag push remains the standard release path. A main-branch commit
      # named "Release vX.Y.Z" is also allowed to create the matching tag/release;
      # this keeps the release operation atomic with the version bump.
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')) }}
      # Keep provider identifiers out of ordinary PR/main artifacts. They are
      # injected only into release builds.
      PETITLYRICS_USER_ID: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))) && secrets.PETITLYRICS_USER_ID || '' }}
      PETITLYRICS_APP_NAME: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))) && secrets.PETITLYRICS_APP_NAME || '' }}
      PETITLYRICS_PKG_NAME: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))) && secrets.PETITLYRICS_PKG_NAME || '' }}
      PETITLYRICS_CLIENT_APP_ID: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))) && secrets.PETITLYRICS_CLIENT_APP_ID || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.name }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ACTUAL_TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]]; then
              echo "Release tag/version mismatch: tag=$ACTUAL_TAG version=${{ steps.version.outputs.name }}" >&2
              exit 1
            fi
          else
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$EXPECTED_TAG" >/dev/null 2>&1
            TAG_LOOKUP_STATUS=$?
            set -e
            if [[ "$TAG_LOOKUP_STATUS" -eq 0 ]]; then
              echo "Release tag already exists: $EXPECTED_TAG" >&2
              echo "Bump versionName/versionCode instead of replacing assets on an older tag." >&2
              exit 1
            elif [[ "$TAG_LOOKUP_STATUS" -ne 2 ]]; then
              echo "Unable to verify whether release tag exists: $EXPECTED_TAG (git ls-remote exit $TAG_LOOKUP_STATUS)" >&2
              exit "$TAG_LOOKUP_STATUS"
            fi
          fi

      - name: Configure optional PetitLyrics release provider
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          missing=()
          for name in \
            PETITLYRICS_USER_ID \
            PETITLYRICS_APP_NAME \
            PETITLYRICS_PKG_NAME \
            PETITLYRICS_CLIENT_APP_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            # Treat the credentials as an all-or-none set. Blank every value so
            # a partially configured release cannot accidentally enable a
            # broken provider in the APK.
            for name in \
              PETITLYRICS_USER_ID \
              PETITLYRICS_APP_NAME \
              PETITLYRICS_PKG_NAME \
              PETITLYRICS_CLIENT_APP_ID; do
              echo "$name=" >> "$GITHUB_ENV"
            done
            echo "::notice title=Optional provider disabled::PetitLyrics is disabled for this release because one or more optional credentials are not configured."
            {
              echo "### PetitLyrics provider disabled"
              echo "This release will continue without PetitLyrics because its optional credentials are incomplete. Other lyric providers are unaffected."
              echo "Missing configuration keys: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### PetitLyrics provider enabled"
              echo "All four optional credentials are configured; PetitLyrics will be included in this release build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run lint
        shell: bash
        run: |
          set +e
          gradle lintDebug
          status=$?
          if (( status != 0 )); then
            report=app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
            if [[ -f "$report" ]]; then
              echo "----- lint-results-debug.txt -----"
              cat "$report"
              echo "----- end lint-results-debug.txt -----"
            fi
          fi
          exit "$status"

      - name: Build APK
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi

      - name: Prepare APK
        run: |
          mkdir -p app/build/outputs/distribution
          if [[ "$IS_RELEASE" == "true" ]]; then
            SOURCE=app/build/outputs/apk/release/app-release.apk
          else
            SOURCE=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SOURCE" \
             "app/build/outputs/distribution/auto-lyrics-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-${{ steps.version.outputs.name }}
          path: app/build/outputs/distribution/auto-lyrics-${{ steps.version.outputs.name }}.apk

      - name: Create Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.name }}
          files: app/build/outputs/distribution/auto-lyrics-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true

  windows-regression:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests with Windows wrapper
        shell: powershell
        run: .\gradlew.bat testDebugUnitTest

      - name: Assemble debug with Windows wrapper
        shell: powershell
        run: .\gradlew.bat assembleDebug

      - name: Lint debug with Windows wrapper
        shell: powershell
        run: .\gradlew.bat lintDebug
